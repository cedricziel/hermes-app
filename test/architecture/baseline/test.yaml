# Baseline of the `test.*` source guards (test/architecture/test_conventions_test.dart).
#
# Rule id -> (repo-relative path -> allowed count of violations). Shrink-only:
# a count above its entry or an unlisted file fails with the offending lines
# and the building block to use instead; a count below its entry fails with the
# exact edit ("lower <rule> <path> to N" or "remove the entry"). Never raise or
# add an entry to get green: fix the call site, or, if the site is legitimate,
# add it to the rule's allowlist in code with a reason, in a reviewed change.
# `UPDATE_BASELINE=1 flutter test test/architecture` lowers it for you and
# never raises it. A rule with no violations has no entry.

# Files that open pull requests change (#1119, #1182); switch each to
# kTestLocalizationsDelegates once that PR has merged: mac_menu_bar_test
# (#1119) and pump_chat (#1182).
test.localization-delegates:
  test/macos/mac_menu_bar_test.dart: 1
  test/support/pump_chat.dart: 1

# Focus ring geometry cases that reach focus with the _focus helper or
# requestFocus instead of tabTo (test/support/tab_to.dart); switch each to
# tabTo and lower the count. The follow-up for the popup callers and menu
# items is tracked on the focus ring sweep.
test.geometry-focus-by-key:
  test/focus_ring_geometry_test.dart: 32
