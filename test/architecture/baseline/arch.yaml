# Baseline of the `arch.*` source guards (test/architecture/architecture_guards_test.dart).
#
# Rule id -> (repo-relative path -> allowed count of violations). Shrink-only:
# a count above its entry or an unlisted file fails with the offending lines
# and the building block to use instead; a count below its entry fails with the
# exact edit ("lower <rule> <path> to N" or "remove the entry"). Never raise or
# add an entry to get green: fix the call site, or, if the site is legitimate,
# add it to the rule's allowlist in code with a reason, in a reviewed change.
# `UPDATE_BASELINE=1 flutter test test/architecture` lowers it for you and
# never raises it. A rule with no violations has no entry.

