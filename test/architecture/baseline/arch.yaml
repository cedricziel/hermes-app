# Baseline of the `arch.*` source guards (test/architecture/architecture_guards_test.dart).
#
# Rule id -> (repo-relative path -> allowed count of violations). Shrink-only:
# a count above its entry or an unlisted file fails with the offending lines
# and the building block to use instead; a count below its entry fails with the
# exact edit ("lower <rule> <path> to N" or "remove the entry"). Never raise or
# add an entry to get green: fix the call site, or, if the site is legitimate,
# add it to the rule's allowlist in code with a reason, in a reviewed change.
# `UPDATE_BASELINE=1 flutter test test/architecture` lowers it for you and
# never raises it. A rule with no violations has no entry.

# arch.gesture-detector-without-focus: open gaps, not allowlisted, each with its
# roadmap item. The reasons live next to `_gestureDetectorKeyboardElsewhere` in
# architecture_guards_test.dart.
#   voice_recording_controls.dart  F.463  the keyboard cannot start a recording
#                                         (hold-to-record); Send is another action
#   swipeable_thread_row.dart,     F.474  thread actions have no keyboard path on
#   touch_row_menu.dart                   iPhone and iPad; Enter opens the chat
#   row_actions.dart               new row (to be numbered): row actions without
#                                         a keyboard path (the profile row's
#                                         Change default model on iOS)
arch.gesture-detector-without-focus:
  lib/src/chat/widgets/swipeable_thread_row.dart: 1
  lib/src/chat/widgets/touch_row_menu.dart: 1
  lib/src/voice/widgets/voice_recording_controls.dart: 1
