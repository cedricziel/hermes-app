version: 2
updates:
  # Flutter/Dart packages (pubspec.yaml).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dart-packages:
        patterns:
          - "*"

  # Actions used by our workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Android's Gradle wrapper/dependencies.
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
