name: Update Flutter

# .fvmrc pins the Flutter release every workflow builds with. This opens a
# PR when a newer stable release ships, so the upgrade runs through CI like
# any other change instead of landing under an unrelated PR or a release.
#
# RELEASE_PLEASE_TOKEN is a PAT: a PR opened with GITHUB_TOKEN does not
# trigger ci.yml, and its checks are the point of the PR.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flutter

env:
  BRANCH: chore/update-flutter

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Resolve the current stable release
        id: flutter
        run: |
          latest=$(curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
            | jq -r '.current_release.stable as $hash | .releases[] | select(.hash == $hash and .channel == "stable") | .version')
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Flutter version: $latest" >&2
            exit 1
          fi
          current=$(jq -r .flutter .fvmrc)
          echo "latest=$latest" >>"$GITHUB_OUTPUT"
          echo "current=$current" >>"$GITHUB_OUTPUT"
          # Only move forward: a pin set ahead of the manifest stays put.
          if [ "$latest" != "$current" ] && \
             [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)" = "$latest" ]; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Open or update the PR
        if: steps.flutter.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          CURRENT: ${{ steps.flutter.outputs.current }}
          LATEST: ${{ steps.flutter.outputs.latest }}
        run: |
          jq --arg v "$LATEST" '.flutter = $v' .fvmrc >"$RUNNER_TEMP/fvmrc"
          mv "$RUNNER_TEMP/fvmrc" .fvmrc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add .fvmrc
          git commit -m "chore(deps): update Flutter to $LATEST"
          git push --force origin "$BRANCH"
          body="Updates the pinned Flutter release from $CURRENT to $LATEST ([release notes](https://docs.flutter.dev/release/release-notes))."
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "chore(deps): update Flutter to $LATEST" --body "$body"
          else
            gh pr create --head "$BRANCH" --title "chore(deps): update Flutter to $LATEST" --body "$body"
          fi
