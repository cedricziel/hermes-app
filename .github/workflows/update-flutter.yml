name: Update Flutter

# .fvmrc pins the Flutter release every workflow builds with. This opens a
# PR when a newer stable release ships, so the upgrade runs through CI like
# any other change instead of landing under an unrelated PR or a release.
#
# RELEASE_PLEASE_TOKEN is a PAT: a PR opened with GITHUB_TOKEN does not
# trigger ci.yml, and its checks are the point of the PR.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flutter

env:
  BRANCH: chore/update-flutter

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Resolve the current stable release
        id: flutter
        run: |
          base=https://storage.googleapis.com/flutter_infra_release/releases
          latest=$(curl -fsSL "$base/releases_linux.json" \
            | jq -r '.current_release.stable as $hash | .releases[] | select(.hash == $hash and .channel == "stable") | .version')
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Flutter version: $latest" >&2
            exit 1
          fi
          # Every runner installs the pin, so wait until macOS and Windows
          # publish it too.
          for os in macos windows; do
            if ! curl -fsSL "$base/releases_$os.json" \
                | jq -e --arg v "$latest" 'any(.releases[]; .channel == "stable" and .version == $v)' >/dev/null; then
              echo "Flutter $latest is not published for $os yet."
              exit 0
            fi
          done
          current=$(jq -r .flutter .fvmrc)
          echo "latest=$latest" >>"$GITHUB_OUTPUT"
          echo "current=$current" >>"$GITHUB_OUTPUT"
          # Only move forward: a pin set ahead of the manifest stays put.
          if [ "$latest" = "$current" ] || \
             [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)" != "$latest" ]; then
            exit 0
          fi
          # An open bump PR that already holds this version needs no new push.
          if git fetch --depth=1 origin "$BRANCH" 2>/dev/null && \
             [ "$(git show FETCH_HEAD:.fvmrc | jq -r .flutter)" = "$latest" ]; then
            echo "$BRANCH already updates to $latest."
            exit 0
          fi
          echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Open or update the PR
        if: steps.flutter.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          CURRENT: ${{ steps.flutter.outputs.current }}
          LATEST: ${{ steps.flutter.outputs.latest }}
        run: |
          jq --arg v "$LATEST" '.flutter = $v' .fvmrc >"$RUNNER_TEMP/fvmrc"
          mv "$RUNNER_TEMP/fvmrc" .fvmrc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add .fvmrc
          git commit -m "chore(deps): update Flutter to $LATEST"
          git push --force origin "$BRANCH"
          body="Updates the pinned Flutter release from $CURRENT to $LATEST ([release notes](https://docs.flutter.dev/release/release-notes))."
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "chore(deps): update Flutter to $LATEST" --body "$body"
          else
            gh pr create --head "$BRANCH" --title "chore(deps): update Flutter to $LATEST" --body "$body"
          fi
