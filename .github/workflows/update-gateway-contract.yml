name: Update gateway contract

# Copies Hermes' gateway contract from hermes-agent main into openrpc/ and
# opens (or refreshes) one PR when it changed. A frame the contract gained
# fails test/gateway/gateway_contract_test.dart on that PR until it is
# classified there.
#
# RELEASE_PLEASE_TOKEN is a PAT: a PR opened with GITHUB_TOKEN does not
# trigger ci.yml, and the failing test is the whole point.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-gateway-contract

env:
  BRANCH: chore/update-gateway-contract

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Fetch the contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_gateway_contract.sh main

      - name: Summarize the change
        id: diff
        run: |
          if git diff --quiet -- openrpc/hermes-gateway.openrpc.json; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >>"$GITHUB_OUTPUT"
          git show HEAD:openrpc/hermes-gateway.openrpc.json >"$RUNNER_TEMP/old.json"
          python3 -I scripts/diff_gateway_contract.py \
            "$RUNNER_TEMP/old.json" openrpc/hermes-gateway.openrpc.json \
            >"$RUNNER_TEMP/body.md"

      - name: Open or update the PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          sha="$(cat openrpc/HERMES_REF)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add openrpc/hermes-gateway.openrpc.json openrpc/HERMES_REF
          git commit -m "chore(gateway): update Hermes' gateway contract to ${sha:0:8}"
          git push --force origin "$BRANCH"
          title="chore(gateway): update Hermes' gateway contract"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
