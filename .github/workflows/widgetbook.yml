name: Component catalog

on:
  push:
    branches: [main]
    paths:
      - widgetbook/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
      - scripts/build-widgetbook.sh
      - .github/workflows/widgetbook.yml
  pull_request:
    paths:
      - widgetbook/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
      - scripts/build-widgetbook.sh
      - .github/workflows/widgetbook.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build the web catalog
        run: scripts/build-widgetbook.sh
        env:
          BASE_HREF: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
