name: CI

on:
  push:
    branches: [main]
  # The label events rerun the gate when `ci:full` is added or removed.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# A newer push cancels the run of a pull request it replaces. On main nothing
# is cancelled once it runs, so every finished merge leaves a complete run
# (a run still waiting in the queue is replaced by the newer one). A label
# event cancels a run in progress only when the label is `ci:full`: that label
# changes what the run must do. Any other label (a bot's, say) queues behind
# the run in progress instead of cancelling a full run; it then runs with the
# same label set and so gives the same result (see "Label gate" in the
# flutter-ci skill for the cost).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci:full') }}

jobs:
  # Decides which heavy jobs a pull request needs. Push to main and manual runs
  # always run everything. Only the paths no build or test reads count as
  # docs-only: docs/, openspec/ and Markdown files anywhere
  # (no test reads such a file from the repository). The watch tests depend on
  # the two Swift packages they run and on this workflow. The platform builds
  # on a pull request run only when a path they read changed (native folders,
  # packages, dependencies, assets, the packaging script, fastlane or this
  # workflow): Dart under lib/ and test/ is analyzed and tested on every code
  # pull request; main's run alone builds it in release mode. A path a build starts to depend on must be added to `builds` below.
  # The release-please pull request (its branch, CHANGELOG.md, the version line
  # of pubspec.yaml and .release-please-manifest.json, nothing else) counts as
  # docs-only too: it is rebuilt after every merge to main and each rebuild
  # cancelled a full test run, while the code it carries was already tested on
  # main. Its tag run builds everything in release-please.yml.
  #
  # Label gate: the heavy jobs (shards, coverage, native audio, watch test and
  # the platform builds) also need `full`, decided by scripts/ci_gate.py. A pull
  # request is FULL with the label `ci:full`, from the release-please branch, or
  # when its base is not main; push, manual and merge-group runs are always
  # FULL; any doubt is FULL. Otherwise it is DEFERRED, and `Analyze & test`
  # fails (unless the pull request is docs-only) until the label is added.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      watch: ${{ steps.filter.outputs.watch }}
      builds: ${{ steps.filter.outputs.builds }}
      full: ${{ github.event_name != 'pull_request' && 'true' || steps.gate.outputs.full || 'true' }}
      gate_reason: ${{ github.event_name != 'pull_request' && 'push, manual or merge-group run' || steps.gate.outputs.gate_reason || 'gate step failed; failing closed' }}
    steps:
      # On a pull request HEAD is the merge commit and HEAD^1 the base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify the changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          code=true
          watch=true
          builds=true
          if [ "$EVENT_NAME" = pull_request ]; then
            # Fail closed: anything unexpected runs everything.
            if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -ne 3 ]; then
              echo "::warning::HEAD is not a merge commit; running everything"
            else
              # NUL-separated and unquoted, so a name with non-ASCII or control
              # characters reaches the patterns below unchanged. A failed diff
              # aborts the step (set -e).
              list="$(mktemp)"
              git -c core.quotePath=false diff --name-only -z --no-renames HEAD^1 HEAD > "$list"
              if [ ! -s "$list" ]; then
                echo "::warning::No changed files found; running everything"
              else
                code=false
                watch=false
                builds=false
                # Stays true only while every file is one a release-please
                # pull request changes.
                release=false
                if [ "$HEAD_REF" = release-please--branches--main--components--hermes-app ]; then
                  release=true
                fi
                while IFS= read -r -d '' file; do
                  echo "changed: $file"
                  case "$file" in
                    CHANGELOG.md | pubspec.yaml | .release-please-manifest.json) ;;
                    *) release=false ;;
                  esac
                  case "$file" in
                    docs/* | openspec/* | *.md) ;;
                    *) code=true ;;
                  esac
                  case "$file" in
                    ios/HermesWatch/* | ios/HermesSurfaceKit/* | .github/workflows/ci.yml) watch=true ;;
                  esac
                  case "$file" in
                    packages/hermes_api/lib/*) ;;
                    android/* | ios/* | macos/* | linux/* | windows/* | web/* | packages/* | assets/* | fastlane/*) builds=true ;;
                    pubspec.yaml | pubspec.lock | */pubspec.yaml | */pubspec.lock | .fvmrc) builds=true ;;
                    scripts/package-linux.sh | design/icon-512.png | .github/workflows/ci.yml) builds=true ;;
                  esac
                done < "$list"
                if [ "$release" = true ]; then
                  # pubspec.yaml may change on its version line only: each
                  # side has exactly one `version: ` line and the files are
                  # equal without it. Compared as files, not as a diff, so no
                  # content line can hide behind diff markers. Any failed
                  # command makes the condition false (fail closed).
                  base_versions="$(git show HEAD^1:pubspec.yaml 2>/dev/null | grep -c '^version: ' || true)"
                  head_versions="$(git show HEAD:pubspec.yaml 2>/dev/null | grep -c '^version: ' || true)"
                  if [ "$base_versions" = 1 ] && [ "$head_versions" = 1 ] \
                    && diff -q \
                      <(git show HEAD^1:pubspec.yaml | sed '/^version: /d') \
                      <(git show HEAD:pubspec.yaml | sed '/^version: /d') > /dev/null 2>&1; then # process-substitution-ok: both files were already shown above with grep -c (a failure there leaves the count at 0 and the condition false), and a differing or failed diff only makes the pull request normal
                    echo "release-please pull request: treated as docs-only"
                    code=false
                    watch=false
                    builds=false
                  else
                    echo "::warning::release-please branch changes more than the version; classifying normally"
                  fi
                fi
              fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "watch=$watch" >> "$GITHUB_OUTPUT"
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "code=$code watch=$watch builds=$builds" >> "$GITHUB_STEP_SUMMARY"

      # The labels are read from the API, not from the event payload, so
      # "Re-run all jobs" sees the labels as they are now. "Re-run failed
      # jobs" reuses this job's outputs, so `Analyze & test` reads the labels
      # again. A failed lookup makes the run FULL (fail closed), and a failed
      # step falls back to full below (continue-on-error).
      - name: Decide full or deferred
        id: gate
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels=""
          labels_error=false
          if [ "$EVENT_NAME" = pull_request ]; then
            labels="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/labels" --jq '.[].name')" || labels_error=true
          fi
          decision="$(LABELS="$labels" LABELS_ERROR="$labels_error" python3 -I scripts/ci_gate.py)"
          echo "$decision" >> "$GITHUB_OUTPUT"
          echo "gate: $decision" | tr '\n' ' ' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Require Swift Package Manager for Apple plugins
        run: python3 scripts/check_apple_spm.py

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Install screenshot test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/script-tests"
          "$RUNNER_TEMP/script-tests/bin/pip" install Pillow pyyaml==6.0.2
          echo "$RUNNER_TEMP/script-tests/bin" >> "$GITHUB_PATH"

      - name: Test scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  test:
    name: Test (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Test
        run: scripts/test-shard.sh ${{ matrix.shard }} 4 --coverage --file-reporter json:build/test-report.json

      - name: List failed tests
        if: failure()
        run: python3 scripts/summarize_test_failures.py build/test-report.json

      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov-${{ matrix.shard }}
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Upload workflow screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-screenshots-${{ matrix.shard }}
          path: build/workflow_screenshots
          if-no-files-found: ignore

  # Information only: nothing needs this job, so a failed download or merge
  # never turns `Analyze & test` red.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, test]
    if: always() && !cancelled() && needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-lcov-*
          path: shard-coverage

      - name: Merge and summarize
        run: |
          shopt -s nullglob
          files=(shard-coverage/*/lcov.info)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shard produced coverage." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          EXPECTED_SHARDS=4 python3 scripts/coverage_summary.py lcov.info summary.md "${files[@]}"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore

  # The required check. It passes only when analysis did, and every test job
  # that was needed did: the shards unless the pull request changed docs only,
  # the Swift package tests unless it left their files alone. A job that was not
  # needed must show as skipped; a failed or cancelled one fails this check.
  # A deferred run (no `ci:full` label, see Changes) fails it when tests are
  # needed: nothing merges before the tests ran on this head. It must not skip,
  # because a skipped required check counts as passing. A docs-only pull request
  # needs no tests and passes deferred too. It reads the labels again, because
  # "Re-run failed jobs" keeps Changes' old `full`: a partial re-run follows
  # today's labels. A failed lookup counts as FULL here too, so a full run that
  # passed is not turned red by a flaky API call.
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, analyze, test, test-watch]
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Only the gate script is needed. A failed checkout must not turn a
      # passing run red: the gate step then fails and the result falls back
      # to the Changes job's decision.
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci_gate.py
          sparse-checkout-cone-mode: false

      - name: Read the current labels
        id: gate
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels=""
          labels_error=false
          if [ "$EVENT_NAME" = pull_request ]; then
            labels="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/labels" --jq '.[].name')" || labels_error=true
          fi
          LABELS="$labels" LABELS_ERROR="$labels_error" python3 -I scripts/ci_gate.py | tee -a "$GITHUB_OUTPUT"

      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          ANALYZE: ${{ needs.analyze.result }}
          TEST: ${{ needs.test.result }}
          TEST_WATCH: ${{ needs.test-watch.result }}
          NEED_TEST: ${{ needs.changes.outputs.code }}
          NEED_WATCH: ${{ needs.changes.outputs.watch }}
          FULL_AT_CHANGES: ${{ needs.changes.outputs.full }}
          FULL_NOW: ${{ steps.gate.outputs.full }}
          GATE_REASON: ${{ steps.gate.outputs.gate_reason }}
        run: |
          fail=0
          # Deferred when Changes said so or the fresh lookup does (a failed
          # step has no output and counts as full): a partial re-run can turn a
          # stale full into deferred, and a deferred run stays deferred because
          # its tests were skipped. Only a new run after labelling runs them.
          FULL=true
          if [ "$FULL_NOW" = false ] || [ "$FULL_AT_CHANGES" = false ]; then FULL=false; fi
          expect() {
            echo "$1: $2 (expected $3)"
            [ "$2" = "$3" ] || fail=1
          }
          expect changes "$CHANGES" success
          expect analyze "$ANALYZE" success
          # An empty or odd output must not read as "not needed": it would let
          # a skipped job pass. Only an exact true or false is an answer.
          for output in NEED_TEST NEED_WATCH; do
            case "${!output}" in
              true | false) ;;
              *)
                echo "::error::Changes output for $output is '${!output}', not true or false"
                fail=1
                ;;
            esac
          done
          if [ "$CHANGES" = success ] && [ "$NEED_TEST" = true ] && [ "$FULL" != true ]; then
            msg="Tests deferred: add the ci:full label when the PR is ready (fleet rules). Nothing merges until the tests ran on this head."
            echo "::error::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "gate: $GATE_REASON"
            fail=1
          else
            if [ "$NEED_TEST" = true ]; then expect test "$TEST" success; else expect test "$TEST" skipped; fi
            if [ "$NEED_WATCH" = true ]; then expect test-watch "$TEST_WATCH" success; else expect test-watch "$TEST_WATCH" skipped; fi
          fi
          exit $fail

  build-android:
    name: Build Android (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, analyze-and-test]
    # Not the default success(): a skipped job upstream (the watch test on most
    # pull requests) would skip the build too.
    if: ${{ !cancelled() && needs.analyze-and-test.result == 'success' && needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true' && needs.changes.outputs.builds == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # A release build, so R8 shrinking is checked too. Without
      # android/key.properties it is signed with the debug key.
      - name: Build release APK
        run: flutter build apk --release

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [changes, analyze-and-test]
    # Not the default success(): a skipped job upstream (the watch test on most
    # pull requests) would skip the build too.
    if: ${{ !cancelled() && needs.analyze-and-test.result == 'success' && needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true' && needs.changes.outputs.builds == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build release
        run: flutter build windows --release

  # The watch app's logic lives in a Swift package (ios/HermesWatch) so it can
  # be tested on the Mac without a watch simulator. The system surfaces' shared
  # package (ios/HermesSurfaceKit: snapshot reader, widget models) is tested
  # here too.
  test-watch:
    name: Test watch core
    needs: changes
    if: needs.changes.outputs.watch == 'true' && needs.changes.outputs.full == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: swift test
        working-directory: ios/HermesWatch
        run: swift test

      - name: swift test (surface kit)
        working-directory: ios/HermesSurfaceKit
        run: swift test

  # Builds the app together with its share extension and watch app. The extension links the
  # receive_sharing_intent package by a version-pinned path in project.pbxproj,
  # so a plugin upgrade that isn't mirrored there breaks only this build.
  build-ios:
    name: Build iOS (simulator)
    runs-on: macos-26
    timeout-minutes: 40
    needs: [changes, analyze-and-test]
    # Not the default success(): a skipped job upstream (the watch test on most
    # pull requests) would skip the build too.
    if: ${{ !cancelled() && needs.analyze-and-test.result == 'success' && needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true' && needs.changes.outputs.builds == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # With a watch app in the project Flutter needs a concrete simulator to
      # pick the matching watchOS SDK.
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available iPhone -j | jq -r '[.devices[][]][0].udid')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build simulator app with share extension and watch app
        run: flutter build ios --simulator --debug --no-codesign -d "${{ steps.simulator.outputs.udid }}"

      # The project-level Release and Profile settings say iphoneos only, and a
      # watch target that inherits that is archived with the iOS SDK. No job
      # here archives for a device, so check the setting directly. It needs the
      # Flutter-generated package, so it runs after the build.
      - name: Watch targets build for watchOS in every configuration
        run: |
          for target in HermesWatch HermesComplication; do
            for configuration in Debug Profile Release; do
              xcodebuild -showBuildSettings -project ios/Runner.xcodeproj \
                -target "$target" -configuration "$configuration" \
                | grep -E 'SUPPORTED_PLATFORMS = watchos watchsimulator$'
            done
          done

  build-macos:
    name: Build macOS (debug)
    runs-on: macos-26
    timeout-minutes: 30
    needs: [changes, analyze-and-test]
    # Not the default success(): a skipped job upstream (the watch test on most
    # pull requests) would skip the build too.
    if: ${{ !cancelled() && needs.analyze-and-test.result == 'success' && needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true' && needs.changes.outputs.builds == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build debug app with share extension
        run: flutter build macos --debug

  # The only test of the real libmpv decoder path in lib/src/voice/. It runs
  # for every code pull request, not only when a platform build does.
  native-audio-test:
    name: Test native audio (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [changes, analyze-and-test]
    if: ${{ !cancelled() && needs.analyze-and-test.result == 'success' && needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install native audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Test native voice codecs
        run: flutter test test/voice/native_voice_player_test.dart --dart-define=HERMES_NATIVE_AUDIO_TEST=true

  # Builds the release bundle and packages it exactly as the release workflow
  # does, so a broken tarball or .deb shows up on the PR instead of at release.
  build-linux:
    name: Build Linux (release)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: [changes, analyze-and-test]
    # Not the default success(): a skipped job upstream (the watch test on most
    # pull requests) would skip the build too.
    if: ${{ !cancelled() && needs.analyze-and-test.result == 'success' && needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true' && needs.changes.outputs.builds == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build release bundle
        run: flutter build linux --release

      - name: Package tar.gz and .deb
        run: scripts/package-linux.sh 0.0.0-ci

      - name: Inspect the .deb
        run: dpkg-deb --info build/linux-dist/*.deb && dpkg-deb --contents build/linux-dist/*.deb
