name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push cancels the run of a pull request it replaces. On main nothing
# is cancelled once it runs, so every finished merge leaves a complete run
# (a run still waiting in the queue is replaced by the newer one).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which heavy jobs a pull request needs. Push to main and manual runs
  # always run everything. Only the paths no build or test reads count as
  # docs-only: docs/, openspec/ and Markdown files anywhere
  # (no test reads such a file from the repository). The watch tests depend on
  # the two Swift packages they run and on this workflow.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      watch: ${{ steps.filter.outputs.watch }}
    steps:
      # On a pull request HEAD is the merge commit and HEAD^1 the base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify the changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          code=true
          watch=true
          if [ "$EVENT_NAME" = pull_request ]; then
            # Fail closed: anything unexpected runs everything.
            if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -ne 3 ]; then
              echo "::warning::HEAD is not a merge commit; running everything"
            else
              files="$(git diff --name-only --no-renames HEAD^1 HEAD)"
              if [ -z "$files" ]; then
                echo "::warning::No changed files found; running everything"
              else
                code=false
                watch=false
                while IFS= read -r file; do
                  echo "changed: $file"
                  case "$file" in
                    docs/* | openspec/* | *.md) ;;
                    *) code=true ;;
                  esac
                  case "$file" in
                    ios/HermesWatch/* | ios/HermesSurfaceKit/* | .github/workflows/ci.yml) watch=true ;;
                  esac
                done <<< "$files"
              fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "watch=$watch" >> "$GITHUB_OUTPUT"
          echo "code=$code watch=$watch" >> "$GITHUB_STEP_SUMMARY"

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Require Swift Package Manager for Apple plugins
        run: python3 scripts/check_apple_spm.py

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Install screenshot test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/script-tests"
          "$RUNNER_TEMP/script-tests/bin/pip" install Pillow
          echo "$RUNNER_TEMP/script-tests/bin" >> "$GITHUB_PATH"

      - name: Test scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  test:
    name: Test (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Test
        run: scripts/test-shard.sh ${{ matrix.shard }} 4 --coverage

      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov-${{ matrix.shard }}
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Upload workflow screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-screenshots-${{ matrix.shard }}
          path: build/workflow_screenshots
          if-no-files-found: ignore

  # Information only: nothing needs this job, so a failed download or merge
  # never turns `Analyze & test` red.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: always() && !cancelled() && needs.changes.outputs.code == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-lcov-*
          path: shard-coverage

      - name: Merge and summarize
        run: |
          shopt -s nullglob
          files=(shard-coverage/*/lcov.info)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shard produced coverage." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          EXPECTED_SHARDS=4 python3 scripts/coverage_summary.py lcov.info summary.md "${files[@]}"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore

  # The required check. It passes only when analysis did, and every test job
  # that was needed did: the shards unless the pull request changed docs only,
  # the Swift package tests unless it left their files alone. A job that was not
  # needed must show as skipped; a failed or cancelled one fails this check.
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    needs: [changes, analyze, test, test-watch]
    if: always()
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          ANALYZE: ${{ needs.analyze.result }}
          TEST: ${{ needs.test.result }}
          TEST_WATCH: ${{ needs.test-watch.result }}
          NEED_TEST: ${{ needs.changes.outputs.code }}
          NEED_WATCH: ${{ needs.changes.outputs.watch }}
        run: |
          fail=0
          expect() {
            echo "$1: $2 (expected $3)"
            [ "$2" = "$3" ] || fail=1
          }
          expect changes "$CHANGES" success
          expect analyze "$ANALYZE" success
          if [ "$NEED_TEST" = true ]; then expect test "$TEST" success; else expect test "$TEST" skipped; fi
          if [ "$NEED_WATCH" = true ]; then expect test-watch "$TEST_WATCH" success; else expect test-watch "$TEST_WATCH" skipped; fi
          exit $fail

  build-android:
    name: Build Android (release)
    runs-on: ubuntu-latest
    needs: [changes, analyze-and-test]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # A release build, so R8 shrinking is checked too. Without
      # android/key.properties it is signed with the debug key.
      - name: Build release APK
        run: flutter build apk --release

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [changes, analyze-and-test]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build release
        run: flutter build windows --release

  # The watch app's logic lives in a Swift package (ios/HermesWatch) so it can
  # be tested on the Mac without a watch simulator. The system surfaces' shared
  # package (ios/HermesSurfaceKit: snapshot reader, widget models) is tested
  # here too.
  test-watch:
    name: Test watch core
    needs: changes
    if: needs.changes.outputs.watch == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: swift test
        working-directory: ios/HermesWatch
        run: swift test

      - name: swift test (surface kit)
        working-directory: ios/HermesSurfaceKit
        run: swift test

  # Builds the app together with its share extension and watch app. The extension links the
  # receive_sharing_intent package by a version-pinned path in project.pbxproj,
  # so a plugin upgrade that isn't mirrored there breaks only this build.
  build-ios:
    name: Build iOS (simulator)
    runs-on: macos-26
    needs: [changes, analyze-and-test]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # With a watch app in the project Flutter needs a concrete simulator to
      # pick the matching watchOS SDK.
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available iPhone -j | jq -r '[.devices[][]][0].udid')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build simulator app with share extension and watch app
        run: flutter build ios --simulator --debug --no-codesign -d "${{ steps.simulator.outputs.udid }}"

      # The project-level Release and Profile settings say iphoneos only, and a
      # watch target that inherits that is archived with the iOS SDK. No job
      # here archives for a device, so check the setting directly. It needs the
      # Flutter-generated package, so it runs after the build.
      - name: Watch targets build for watchOS in every configuration
        run: |
          for target in HermesWatch HermesComplication; do
            for configuration in Debug Profile Release; do
              xcodebuild -showBuildSettings -project ios/Runner.xcodeproj \
                -target "$target" -configuration "$configuration" \
                | grep -E 'SUPPORTED_PLATFORMS = watchos watchsimulator$'
            done
          done

  build-macos:
    name: Build macOS (debug)
    runs-on: macos-26
    needs: [changes, analyze-and-test]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build debug app with share extension
        run: flutter build macos --debug

  # Builds the release bundle and packages it exactly as the release workflow
  # does, so a broken tarball or .deb shows up on the PR instead of at release.
  build-linux:
    name: Build Linux (release)
    runs-on: ubuntu-22.04
    needs: [changes, analyze-and-test]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Test native voice codecs
        run: flutter test test/voice/native_voice_player_test.dart --dart-define=HERMES_NATIVE_AUDIO_TEST=true

      - name: Build release bundle
        run: flutter build linux --release

      - name: Package tar.gz and .deb
        run: scripts/package-linux.sh 0.0.0-ci

      - name: Inspect the .deb
        run: dpkg-deb --info build/linux-dist/*.deb && dpkg-deb --contents build/linux-dist/*.deb
