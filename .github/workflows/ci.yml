name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push cancels the run of a pull request it replaces. On main nothing
# is cancelled once it runs, so every finished merge leaves a complete run
# (a run still waiting in the queue is replaced by the newer one).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which heavy jobs a pull request needs. Push to main and manual runs
  # always run everything. Only the paths no build or test reads count as
  # docs-only: docs/, openspec/ and Markdown files anywhere
  # (no test reads such a file from the repository). The watch tests depend on
  # the two Swift packages they run and on this workflow. The platform builds
  # on a pull request run only when a path they read changed (native folders,
  # packages, dependencies, assets, the packaging script, fastlane or this
  # workflow): Dart under lib/ and test/ is analyzed and tested on every code
  # pull request; main's run alone builds it in release mode. A path a build starts to depend on must be added to `builds` below.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      watch: ${{ steps.filter.outputs.watch }}
      builds: ${{ steps.filter.outputs.builds }}
    steps:
      # On a pull request HEAD is the merge commit and HEAD^1 the base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify the changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          code=true
          watch=true
          builds=true
          if [ "$EVENT_NAME" = pull_request ]; then
            # Fail closed: anything unexpected runs everything.
            if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -ne 3 ]; then
              echo "::warning::HEAD is not a merge commit; running everything"
            else
              # NUL-separated and unquoted, so a name with non-ASCII or control
              # characters reaches the patterns below unchanged. A failed diff
              # aborts the step (set -e).
              list="$(mktemp)"
              git -c core.quotePath=false diff --name-only -z --no-renames HEAD^1 HEAD > "$list"
              if [ ! -s "$list" ]; then
                echo "::warning::No changed files found; running everything"
              else
                code=false
                watch=false
                builds=false
                while IFS= read -r -d '' file; do
                  echo "changed: $file"
                  case "$file" in
                    docs/* | openspec/* | *.md) ;;
                    *) code=true ;;
                  esac
                  case "$file" in
                    ios/HermesWatch/* | ios/HermesSurfaceKit/* | .github/workflows/ci.yml) watch=true ;;
                  esac
                  case "$file" in
                    packages/hermes_api/lib/*) ;;
                    android/* | ios/* | macos/* | linux/* | windows/* | web/* | packages/* | assets/* | fastlane/*) builds=true ;;
                    pubspec.yaml | pubspec.lock | */pubspec.yaml | */pubspec.lock | .fvmrc) builds=true ;;
                    scripts/package-linux.sh | design/icon-512.png | .github/workflows/ci.yml) builds=true ;;
                  esac
                done < "$list"
              fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "watch=$watch" >> "$GITHUB_OUTPUT"
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "code=$code watch=$watch builds=$builds" >> "$GITHUB_STEP_SUMMARY"

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Require Swift Package Manager for Apple plugins
        run: python3 scripts/check_apple_spm.py

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Install screenshot test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/script-tests"
          "$RUNNER_TEMP/script-tests/bin/pip" install Pillow
          echo "$RUNNER_TEMP/script-tests/bin" >> "$GITHUB_PATH"

      - name: Test scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  test:
    name: Test (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Test
        run: scripts/test-shard.sh ${{ matrix.shard }} 4 --coverage --file-reporter json:build/test-report.json

      - name: List failed tests
        if: failure()
        run: python3 scripts/summarize_test_failures.py build/test-report.json

      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov-${{ matrix.shard }}
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Upload workflow screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-screenshots-${{ matrix.shard }}
          path: build/workflow_screenshots
          if-no-files-found: ignore

  # Information only: nothing needs this job, so a failed download or merge
  # never turns `Analyze & test` red.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: always() && !cancelled() && needs.changes.outputs.code == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-lcov-*
          path: shard-coverage

      - name: Merge and summarize
        run: |
          shopt -s nullglob
          files=(shard-coverage/*/lcov.info)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shard produced coverage." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          EXPECTED_SHARDS=4 python3 scripts/coverage_summary.py lcov.info summary.md "${files[@]}"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore

  # The required check. It passes only when analysis did, and every test job
  # that was needed did: the shards unless the pull request changed docs only,
  # the Swift package tests unless it left their files alone. A job that was not
  # needed must show as skipped; a failed or cancelled one fails this check.
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    needs: [changes, analyze, test, test-watch]
    if: always()
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          ANALYZE: ${{ needs.analyze.result }}
          TEST: ${{ needs.test.result }}
          TEST_WATCH: ${{ needs.test-watch.result }}
          NEED_TEST: ${{ needs.changes.outputs.code }}
          NEED_WATCH: ${{ needs.changes.outputs.watch }}
        run: |
          fail=0
          expect() {
            echo "$1: $2 (expected $3)"
            [ "$2" = "$3" ] || fail=1
          }
          expect changes "$CHANGES" success
          expect analyze "$ANALYZE" success
          if [ "$NEED_TEST" = true ]; then expect test "$TEST" success; else expect test "$TEST" skipped; fi
          if [ "$NEED_WATCH" = true ]; then expect test-watch "$TEST_WATCH" success; else expect test-watch "$TEST_WATCH" skipped; fi
          exit $fail

  build-android:
    name: Build Android (release)
    runs-on: ubuntu-latest
    needs: [changes, analyze-and-test]
    # Not the default success(): a skipped job upstream (the watch test on most
    # pull requests) would skip the build too.
    if: ${{ !cancelled() && needs.analyze-and-test.result == 'success' && needs.changes.outputs.code == 'true' && needs.changes.outputs.builds == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # A release build, so R8 shrinking is checked too. Without
      # android/key.properties it is signed with the debug key.
      - name: Build release APK
        run: flutter build apk --release

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [changes, analyze-and-test]
    # Not the default success(): a skipped job upstream (the watch test on most
    # pull requests) would skip the build too.
    if: ${{ !cancelled() && needs.analyze-and-test.result == 'success' && needs.changes.outputs.code == 'true' && needs.changes.outputs.builds == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build release
        run: flutter build windows --release

  # The watch app's logic lives in a Swift package (ios/HermesWatch) so it can
  # be tested on the Mac without a watch simulator. The system surfaces' shared
  # package (ios/HermesSurfaceKit: snapshot reader, widget models) is tested
  # here too.
  test-watch:
    name: Test watch core
    needs: changes
    if: needs.changes.outputs.watch == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: swift test
        working-directory: ios/HermesWatch
        run: swift test

      - name: swift test (surface kit)
        working-directory: ios/HermesSurfaceKit
        run: swift test

  # Builds the app together with its share extension and watch app. The extension links the
  # receive_sharing_intent package by a version-pinned path in project.pbxproj,
  # so a plugin upgrade that isn't mirrored there breaks only this build.
  build-ios:
    name: Build iOS (simulator)
    runs-on: macos-26
    needs: [changes, analyze-and-test]
    # Not the default success(): a skipped job upstream (the watch test on most
    # pull requests) would skip the build too.
    if: ${{ !cancelled() && needs.analyze-and-test.result == 'success' && needs.changes.outputs.code == 'true' && needs.changes.outputs.builds == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # With a watch app in the project Flutter needs a concrete simulator to
      # pick the matching watchOS SDK.
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available iPhone -j | jq -r '[.devices[][]][0].udid')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build simulator app with share extension and watch app
        run: flutter build ios --simulator --debug --no-codesign -d "${{ steps.simulator.outputs.udid }}"

      # The Runner's unit tests (the watch relay). The build above generated
      # the Flutter package the workspace needs.
      - name: Runner unit tests
        run: |
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:RunnerTests -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO

      # The project-level Release and Profile settings say iphoneos only, and a
      # watch target that inherits that is archived with the iOS SDK. No job
      # here archives for a device, so check the setting directly. It needs the
      # Flutter-generated package, so it runs after the build.
      - name: Watch targets build for watchOS in every configuration
        run: |
          for target in HermesWatch HermesComplication; do
            for configuration in Debug Profile Release; do
              xcodebuild -showBuildSettings -project ios/Runner.xcodeproj \
                -target "$target" -configuration "$configuration" \
                | grep -E 'SUPPORTED_PLATFORMS = watchos watchsimulator$'
            done
          done

  build-macos:
    name: Build macOS (debug)
    runs-on: macos-26
    needs: [changes, analyze-and-test]
    # Not the default success(): a skipped job upstream (the watch test on most
    # pull requests) would skip the build too.
    if: ${{ !cancelled() && needs.analyze-and-test.result == 'success' && needs.changes.outputs.code == 'true' && needs.changes.outputs.builds == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build debug app with share extension
        run: flutter build macos --debug

      # The debug build alone has the HERMES_REPORT_WINDOW branch in
      # AppDelegate.swift: once launch has settled it prints the main window's
      # frame, title bar height, minimum content size, whether the style has the
      # full-size content view and the screen's visible size, optionally resizes
      # the frame (HERMES_REPORT_WINDOW_SET) and quits normally, so AppKit writes
      # the frame it remembers. Launch 1 must show the defaults, launch 2 the
      # resized frame. The defaults are kMacMainWindowDefaultSize and
      # kMacMainWindowMinSize in lib/src/theme/breakpoints.dart; keep them in step.
      - name: Measure the main window size and its remembered frame
        run: |
          set -o pipefail
          name="$(sed -n 's/^PRODUCT_NAME *= *//p' macos/Runner/Configs/AppInfo.xcconfig)"
          app="build/macos/Build/Products/Debug/$name.app"
          bin="$app/Contents/MacOS/$name"
          [ -x "$bin" ] || { echo "::error::No debug binary at $bin"; exit 1; }
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          # The Debug app is sandboxed, so its defaults live in its container, not
          # in ~/Library/Preferences.
          prefs="$HOME/Library/Containers/$bundle/Data/Library/Preferences/$bundle.plist"
          key="NSWindow Frame HermesMainWindow"
          forget() { defaults delete "$prefs" "$key" 2>/dev/null || true; }
          trap 'rm -f window.log' EXIT
          # One launch: prints the HERMES_WINDOW line, or fails with the log.
          launch() { # <label> [WxH to resize to before quitting]
            start=$SECONDS
            if HERMES_REPORT_WINDOW=1 HERMES_REPORT_WINDOW_SET="${2:-}" perl -e 'alarm 60; exec @ARGV' "$bin" \
              -ApplePersistenceIgnoreState YES > window.log 2>&1; then status=0; else status=$?; fi
            echo "launch $1 took $(( SECONDS - start )) s, exit status $status"
            if [ "$status" -eq 142 ]; then
              echo "::error::Launch $1 did not quit within 60 s (SIGALRM); log follows."; tail -n 40 window.log; forget; exit 1
            elif [ "$status" -ne 0 ]; then
              echo "::error::Launch $1 exited with status $status; log follows."; tail -n 40 window.log; forget; exit 1
            fi
            line="$(grep -E '^HERMES_WINDOW ' window.log | head -n 1 || true)"
            if [ -z "$line" ]; then
              echo "::error::Launch $1 printed no HERMES_WINDOW line (crashed, or the window never appeared); log follows."
              tail -n 40 window.log
              forget; exit 1
            fi
            echo "launch $1: $line"
            if [[ "$line" =~ ^HERMES_WINDOW\ frame=([0-9]+)x([0-9]+)\ chrome=([0-9]+)\ min=([0-9]+x[0-9]+)\ full=(true|false)\ screen=([0-9]+x[0-9]+)$ ]]; then
              frame="${BASH_REMATCH[1]}x${BASH_REMATCH[2]}"
              content="${BASH_REMATCH[1]}x$(( BASH_REMATCH[2] - BASH_REMATCH[3] ))"
              min="${BASH_REMATCH[4]}"; full="${BASH_REMATCH[5]}"; screen="${BASH_REMATCH[6]}"
            else
              echo "::error::Unreadable HERMES_WINDOW line: $line"; forget; exit 1
            fi
            # The frame is only the xib's content size plus the title bar once the
            # full-size content view is in; the report waits up to 5 s for it.
            if [ "$full" != "true" ]; then
              echo "::error::Launch $1: the window never got the full-size content view: $line"; forget; exit 1
            fi
            if [ "$min" != "640x480" ]; then
              echo "::error::Launch $1: minimum content size is $min, expected 640x480 (screen $screen): $line"; forget; exit 1
            fi
          }
          forget   # nothing may depend on what the runner remembered
          # frame minus the title bar is the xib's content size
          launch 1 900x600
          if [ "$content" != "1100x760" ]; then
            echo "::error::Launch 1: default content size is $content, expected 1100x760 (screen $screen): $line"; forget; exit 1
          fi
          launch 2
          # AppKit must have written the frame to the sandbox container's defaults.
          if ! defaults read "$prefs" "$key"; then
            echo "::error::No '$key' in $prefs after launch 2; the frame was not saved there."; ls -la "$(dirname "$prefs")" || true; forget; exit 1
          fi
          if [ "$frame" != "900x600" ]; then
            echo "::error::Launch 2: the window came back as a $frame frame, expected the 900x600 it was resized to (screen $screen): $line"; forget; exit 1
          fi
          forget

  # The only test of the real libmpv decoder path in lib/src/voice/. It runs
  # for every code pull request, not only when a platform build does.
  native-audio-test:
    name: Test native audio (Linux)
    runs-on: ubuntu-22.04
    needs: [changes, analyze-and-test]
    if: ${{ !cancelled() && needs.analyze-and-test.result == 'success' && needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install native audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Test native voice codecs
        run: flutter test test/voice/native_voice_player_test.dart --dart-define=HERMES_NATIVE_AUDIO_TEST=true

  # Builds the release bundle and packages it exactly as the release workflow
  # does, so a broken tarball or .deb shows up on the PR instead of at release.
  build-linux:
    name: Build Linux (release)
    runs-on: ubuntu-22.04
    needs: [changes, analyze-and-test]
    # Not the default success(): a skipped job upstream (the watch test on most
    # pull requests) would skip the build too.
    if: ${{ !cancelled() && needs.analyze-and-test.result == 'success' && needs.changes.outputs.code == 'true' && needs.changes.outputs.builds == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build release bundle
        run: flutter build linux --release

      - name: Package tar.gz and .deb
        run: scripts/package-linux.sh 0.0.0-ci

      - name: Inspect the .deb
        run: dpkg-deb --info build/linux-dist/*.deb && dpkg-deb --contents build/linux-dist/*.deb
