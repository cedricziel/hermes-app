name: Verify generated Hermes API client

on:
  push:
    branches: [main]
    paths:
      - "openapi/**"
      - "scripts/**"
      - "packages/hermes_api/**"
      - "openapitools.json"
      - ".github/workflows/verify-hermes-api-client.yml"
  pull_request:
    paths:
      - "openapi/**"
      - "scripts/**"
      - "packages/hermes_api/**"
      - "openapitools.json"
      - ".github/workflows/verify-hermes-api-client.yml"
  workflow_dispatch:

concurrency:
  group: verify-hermes-api-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: packages/hermes_api matches the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: dart-lang/setup-dart@v1

      - name: Regenerate packages/hermes_api
        run: ./scripts/generate_hermes_api_client.sh

      - name: Fail if regeneration produced a diff
        run: |
          if ! git diff --exit-code -- packages/hermes_api; then
            echo "::error::packages/hermes_api is out of date with openapi/hermes-agent.openapi.json. Run ./scripts/generate_hermes_api_client.sh and commit the result."
            exit 1
          fi
