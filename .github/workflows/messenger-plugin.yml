name: Hermes App messenger

on:
  pull_request:
    paths:
      - 'plugins/hermes-app/**'
      - 'openapi/HERMES_REF'
      - 'openrpc/HERMES_REF'
      - 'scripts/hermes_contracts.py'
      - '.github/workflows/messenger-plugin.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/hermes-app/**'
      - 'openapi/HERMES_REF'
      - 'openrpc/HERMES_REF'
      - 'scripts/hermes_contracts.py'
      - '.github/workflows/messenger-plugin.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  messenger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve the app's Hermes revision
        id: hermes
        run: echo "ref=$(python3 -I scripts/hermes_contracts.py resolve)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.hermes.outputs.ref }}
          path: .hermes-backend
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .hermes-backend/pyproject.toml
      - name: Install Hermes test runtime
        run: pip install -e ./.hermes-backend
      - name: Exercise messenger delivery against Hermes
        env:
          PYTHONPATH: ${{ github.workspace }}/.hermes-backend
        run: python -m unittest discover -s plugins/hermes-app/tests -v
