name: Real backend contract

# Advisory coverage uses isolated state and free scripted loopback model turns.
# Paid-provider and external pairing scenarios stay disabled.

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/dev-backend.sh"
      - "scripts/hermes_contracts.py"
      - "scripts/test_hermes_contracts.py"
      - "openapi/HERMES_REF"
      - "openrpc/HERMES_REF"
      - ".github/workflows/real-backend-contract.yml"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/dev-backend.sh"
      - "scripts/hermes_contracts.py"
      - "scripts/test_hermes_contracts.py"
      - "openapi/HERMES_REF"
      - "openrpc/HERMES_REF"
      - ".github/workflows/real-backend-contract.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_NO_CONFIG: "1"

jobs:
  contract:
    name: Contract test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Test contract tooling
        run: python3 -I scripts/test_hermes_contracts.py

      - name: Resolve contract provenance
        id: ref
        run: |
          sha=$(python3 -I scripts/hermes_contracts.py resolve)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Download Hermes Agent
        id: download
        env:
          HERMES_REF: ${{ steps.ref.outputs.sha }}
        run: |
          mkdir -p "$HOME/hermes-agent"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://codeload.github.com/NousResearch/hermes-agent/tar.gz/$HERMES_REF" |
            tar xz -C "$HOME/hermes-agent" --strip-components=1

      # The dashboard serves a Vite build that is not in the source tree, and
      # its session token is injected into the built index.html.
      - name: Restore the web UI build
        id: web
        uses: actions/cache@v6
        with:
          path: ~/hermes-agent/hermes_cli/web_dist
          key: hermes-web-${{ steps.ref.outputs.sha }}

      - uses: actions/setup-node@v7
        if: steps.web.outputs.cache-hit != 'true'
        with:
          node-version: "24"

      - name: Build the web UI
        if: steps.web.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/hermes-agent"
          npm ci --workspace web --include=dev --no-audit --no-fund
          npm run build --workspace web

      # Installing Hermes takes about ten seconds, and there is no lockfile
      # here for a uv cache to key on.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false

      # The mcp extra carries the HTTP client the MCP server tests probe with.
      - name: Install Hermes Agent
        id: install
        run: |
          uv venv --python 3.14 "$HOME/hermes-agent/.venv"
          uv pip install --python "$HOME/hermes-agent/.venv/bin/python" -e "$HOME/hermes-agent[mcp]"
          echo "$HOME/hermes-agent/.venv/bin" >> "$GITHUB_PATH"
          echo "HERMES_WEB_DIST=$HOME/hermes-agent/hermes_cli/web_dist" >> "$GITHUB_ENV"

      # dev-backend.sh uses lsof to find the port the dashboard picked.
      - name: Start the dev backend
        id: start
        run: |
          command -v lsof >/dev/null || sudo apt-get install -y --no-install-recommends lsof
          unset HERMES_DEV_MODEL_CALLS HERMES_DEV_TELEGRAM_PAIRING
          scripts/dev-backend.sh start

      - name: Run the contract test
        id: tests
        run: |
          unset HERMES_DEV_MODEL_CALLS HERMES_DEV_TELEGRAM_PAIRING
          HERMES_DEV_URL="$(scripts/dev-backend.sh url)" flutter test test/real_backend_contract_test.dart

      - name: Show the backend log
        if: failure()
        run: cat .dart_tool/hermes-dev/dashboard.log

      - name: Stop the dev backend
        id: stop
        if: always()
        run: scripts/dev-backend.sh stop

      - name: Summarize advisory evidence
        if: always()
        run: |
          python3 -I scripts/hermes_contracts.py summary \
            --provenance "${{ steps.ref.outcome }}" \
            --download "${{ steps.download.outcome }}" \
            --install "${{ steps.install.outcome }}" \
            --start "${{ steps.start.outcome }}" \
            --tests "${{ steps.tests.outcome }}" \
            --cleanup "${{ steps.stop.outcome }}" >>"$GITHUB_STEP_SUMMARY"
