name: release-please

# 1. `release-please` keeps a release PR in sync with conventional commits on
#    main. Merging it cuts a `vX.Y.Z` tag and a GitHub pre-release
#    (`prerelease` in release-please-config.json); promote one to a full
#    release by hand.
# 2. `testflight` then builds that tag on a macOS runner, signs it via fastlane
#    match and uploads it to TestFlight, for iOS and macOS in parallel.
# 3. The other jobs build that tag and attach downloads to the GitHub release:
#    `macos-dmg` a notarized Developer ID DMG, `linux` a tar.gz and a .deb for
#    x86_64 and arm64, `android` an APK and an AAB signed with the upload key,
#    `windows` a zip of the x64 build (unsigned).
#
# `workflow_dispatch` with a `tag` re-runs the build jobs for an existing tag
# (e.g. after a failed upload); `only` limits that to one of them. Tags before
# the macos-dmg, android and windows jobs existed lack what those jobs need.
# Without a tag it runs release-please.
#
# RELEASE_PLEASE_TOKEN must be a PAT: a PR opened with GITHUB_TOKEN does not
# trigger ci.yml, which would leave the release PR ungated.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.1.0) to rebuild and upload. Leave blank to run release-please.
        required: false
        default: ""
      only:
        description: With a tag, rebuild only this part of the release.
        type: choice
        options: [all, testflight, macos-dmg, linux, android, windows]
        default: all

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: ${{ inputs.tag == '' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  testflight:
    name: TestFlight (${{ matrix.platform }})
    needs: [release-please]
    # release-please is skipped on a tag dispatch, so `always()` is needed for
    # this job to be evaluated at all.
    if: |
      always() && (
        (inputs.tag != '' && (inputs.only == 'all' || inputs.only == 'testflight')) ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            lane_platform: ios
            artifact_glob: build/fastlane/*.ipa
          - platform: macos
            lane_platform: mac
            artifact_glob: build/fastlane/*.pkg
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # fetch-depth: 0 so the commit-count build number is the real one.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      - name: Require Swift Package Manager for Apple plugins
        run: python3 scripts/check_apple_spm.py

      - name: Fetch release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          raw="$RUNNER_TEMP/release_notes_raw.md"
          file="$RUNNER_TEMP/release_notes.txt"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$raw" || : > "$raw"
          # TestFlight shows the notes as plain text, so release-please's
          # markdown is stripped. Formatting must never block a release: an
          # older tag without the script, or a failure, falls back to the raw
          # notes cut to TestFlight's 4000 characters, and then to none (the
          # lane then sends a build line).
          python3 scripts/plain_release_notes.py < "$raw" > "$file" \
            || python3 -c 'import sys; sys.stdout.write(sys.stdin.read()[:4000])' < "$raw" > "$file" \
            || : > "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Configure SSH for match repo
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          # Both must be set for the build to enable telemetry; if either is
          # missing the build still succeeds with telemetry off.
          OTLP_INGEST_URL: ${{ secrets.OTLP_INGEST_URL }}
          OTLP_INGEST_KEY: ${{ secrets.OTLP_INGEST_KEY }}
          RELEASE_NOTES_FILE: ${{ steps.notes.outputs.file }}
          # The demo account Beta App Review signs in with.
          REVIEW_CONTACT_FIRST_NAME: ${{ secrets.REVIEW_CONTACT_FIRST_NAME }}
          REVIEW_CONTACT_LAST_NAME: ${{ secrets.REVIEW_CONTACT_LAST_NAME }}
          REVIEW_CONTACT_PHONE: ${{ secrets.REVIEW_CONTACT_PHONE }}
          REVIEW_CONTACT_EMAIL: ${{ secrets.REVIEW_CONTACT_EMAIL }}
          REVIEW_DEMO_URL: ${{ secrets.REVIEW_DEMO_URL }}
          REVIEW_DEMO_USER: ${{ secrets.REVIEW_DEMO_USER }}
          REVIEW_DEMO_PASSWORD: ${{ secrets.REVIEW_DEMO_PASSWORD }}
          FASTLANE_HIDE_CHANGELOG: "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
        run: bundle exec fastlane ${{ matrix.lane_platform }} release version:"${TAG#v}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hermes-app-${{ matrix.platform }}-${{ env.TAG }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: ignore
          retention-days: 30

  macos-dmg:
    name: macOS DMG
    needs: [release-please]
    if: |
      always() && (
        (inputs.tag != '' && (inputs.only == 'all' || inputs.only == 'macos-dmg')) ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # fetch-depth: 0 so the commit-count build number is the real one.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      - name: Configure SSH for match repo
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Build and notarize the DMG
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          OTLP_INGEST_URL: ${{ secrets.OTLP_INGEST_URL }}
          OTLP_INGEST_KEY: ${{ secrets.OTLP_INGEST_KEY }}
          FASTLANE_HIDE_CHANGELOG: "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
        run: bundle exec fastlane mac dmg version:"${TAG#v}"

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" build/fastlane/*.dmg --clobber --repo "$GITHUB_REPOSITORY"

  linux:
    name: Linux (${{ matrix.arch }})
    needs: [release-please]
    if: |
      always() && (
        (inputs.tag != '' && (inputs.only == 'all' || inputs.only == 'linux')) ||
        needs.release-please.outputs.release_created == 'true'
      )
    # Built on the oldest supported LTS so the binary runs on older glibc too.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libmpv-dev

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x86_64'
        with:
          flutter-version-file: .fvmrc
          cache: true

      # Flutter publishes no stable Linux arm64 SDK, so build the pinned
      # release from its git tag instead.
      - uses: subosito/flutter-action@v2
        if: matrix.arch != 'x86_64'
        with:
          channel: master
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      - name: Build release bundle
        env:
          # Both must be set for the build to enable telemetry; if either is
          # missing the build still succeeds with telemetry off.
          OTLP_INGEST_URL: ${{ secrets.OTLP_INGEST_URL }}
          OTLP_INGEST_KEY: ${{ secrets.OTLP_INGEST_KEY }}
        run: |
          out=$(scripts/release-dart-defines.sh "${TAG#v}")
          defines=()
          [ -z "$out" ] || mapfile -t defines <<< "$out"
          flutter build linux --release "${defines[@]}"

      - name: Package tar.gz and .deb
        run: scripts/package-linux.sh "${TAG#v}"

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" build/linux-dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v7
        with:
          name: hermes-app-linux-${{ matrix.arch }}-${{ env.TAG }}
          path: build/linux-dist/*
          retention-days: 30

  android:
    name: Android
    needs: [release-please]
    if: |
      always() && (
        (inputs.tag != '' && (inputs.only == 'all' || inputs.only == 'android')) ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # fetch-depth: 0 so the commit-count build number is the real one.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      # Android only installs an update signed with the same key, so a
      # missing key fails the release instead of shipping a debug-signed APK.
      - name: Write the upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ] || [ -z "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 and ANDROID_UPLOAD_KEYSTORE_PASSWORD must be set."
            exit 1
          fi
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.p12"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.p12
          storePassword=$ANDROID_UPLOAD_KEYSTORE_PASSWORD
          keyAlias=upload
          keyPassword=$ANDROID_UPLOAD_KEYSTORE_PASSWORD
          EOF

      - name: Build APK and AAB
        env:
          OTLP_INGEST_URL: ${{ secrets.OTLP_INGEST_URL }}
          OTLP_INGEST_KEY: ${{ secrets.OTLP_INGEST_KEY }}
        run: |
          out=$(scripts/release-dart-defines.sh "${TAG#v}")
          defines=()
          [ -z "$out" ] || mapfile -t defines <<< "$out"
          flags=(--release --build-name="${TAG#v}" --build-number="$(git rev-list --count HEAD)" "${defines[@]}")
          flutter build apk "${flags[@]}"
          flutter build appbundle "${flags[@]}"
          mkdir -p build/android-dist
          cp build/app/outputs/flutter-apk/app-release.apk "build/android-dist/hermes-app-${TAG#v}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "build/android-dist/hermes-app-${TAG#v}-android.aab"

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" build/android-dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Remove the upload key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.p12"

  windows:
    name: Windows
    needs: [release-please]
    if: |
      always() && (
        (inputs.tag != '' && (inputs.only == 'all' || inputs.only == 'windows')) ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      - name: Build release
        env:
          OTLP_INGEST_URL: ${{ secrets.OTLP_INGEST_URL }}
          OTLP_INGEST_KEY: ${{ secrets.OTLP_INGEST_KEY }}
        run: |
          out=$(scripts/release-dart-defines.sh "${TAG#v}")
          defines=()
          [ -z "$out" ] || mapfile -t defines <<< "$out"
          flutter build windows --release "${defines[@]}"

      - name: Package zip
        shell: pwsh
        run: |
          $name = "hermes-app-$($env:TAG.TrimStart('v'))-windows-x64"
          New-Item -ItemType Directory -Force build/windows-dist | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release "build/windows-dist/$name"
          # Flutter apps need the MSVC runtime, which not every PC has.
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$dll" "build/windows-dist/$name/"
          }
          Compress-Archive -Path "build/windows-dist/$name" -DestinationPath "build/windows-dist/$name.zip"
          Remove-Item -Recurse "build/windows-dist/$name"

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" build/windows-dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
